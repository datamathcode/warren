# Runs warren's full local gate (`bun run check:all`,
# scripts/check-all.ts, all 12 gates) where ci.yml does not:
#   - on pull requests whose base is NOT main (stacked PRs; ci.yml runs
#     only on PRs to main and already runs all 12 gates there), and
#   - on manual dispatch.
# On pull requests to main the job is skipped, so it does not repeat
# ci.yml.
#
# DMC Labs addition. This file does not exist in the upstream repo
# (jayminwest/warren). Its name does not start with "ci", so
# scripts/check-ci-parity.ts does not parse it; ci.yml stays the
# workflow that check:ci-parity compares against.
#
# No secrets. The job only reads the repository.
name: check-all

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-all-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-all:
    if: github.event_name == 'workflow_dispatch' || github.base_ref != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # .bun-version pins Bun 1.3.14 (same input that ci.yml uses).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # Same step as ci.yml (warren-3c1e). Without bubblewrap, the
      # sandbox tests inside check:coverage skip. Ubuntu 24.04 blocks
      # unprivileged user namespaces through AppArmor, so lift that,
      # then prove bwrap can start.
      - name: Install bubblewrap for the sandbox tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --unshare-all --die-with-parent --ro-bind / / true

      - run: bun install --frozen-lockfile

      - name: Run all gates
        run: bun run check:all
