                $ref: '#/components/schemas/ErrorEnvelope'
      security: []
  /whoami:
    get:
      operationId: whoamiHandler
      tags:
        - whoami
      summary: GET /whoami
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Whoami'
        4XX:
          description: Client error (400, 401, 403, 404, 409, 422, or 429). The body is the error envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        default:
          description: Any other error, including a 500 internal error. The body is the error envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
