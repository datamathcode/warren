components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Operator bearer token (WARREN_API_TOKEN). Anonymous routes set security to an empty array.
  schemas:
    Agent:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        renderedJson: {}
        registeredAt:
          type: string
        lastRefreshed:
          type: string
        description:
          anyOf:
            - type: string
            - type: 'null'
        provider:
          anyOf:
            - type: string
            - type: 'null'
        model:
          anyOf:
            - type: string
            - type: 'null'
        source:
          $ref: '#/components/schemas/AgentSource'
      required:
        - id
        - name
        - registeredAt
        - lastRefreshed
        - description
        - provider
        - model
        - source
      additionalProperties: false
      description: An agent row. `renderedJson` is omitted for a public spectator.
    AgentSource:
      type: string
      enum:
        - builtin
        - library
    CancelPlanRunResponse:
      type: object
      properties:
        planRun:
          $ref: '#/components/schemas/PlanRun'
        cancelledChild:
          anyOf:
            - type: object
              properties:
                childSeq:
                  type: integer
                runId:
                  type: string
              required:
                - childSeq
                - runId
              additionalProperties: false
            - type: 'null'
        alreadyTerminal:
          type: boolean
      required:
        - planRun
        - cancelledChild
        - alreadyTerminal
      additionalProperties: false
    CloneKind:
      type: string
      enum:
        - replicate
        - continue
        - rescue
    CreatePlanRunRequest:
      type: object
      properties:
        project:
          type: string
          minLength: 1
        agent:
          type: string
          minLength: 1
        planId:
          anyOf:
            - type: string
            - type: 'null'
        issues:
          anyOf:
            - type: array
              items:
                type: string
            - type: 'null'
        promptTemplate:
          anyOf:
            - type: string
            - type: 'null'
        ref:
          anyOf:
            - type: string
            - type: 'null'
        providerOverride:
          anyOf:
            - type: string
            - type: 'null'
        modelOverride:
          anyOf:
            - type: string
            - type: 'null'
        maxCostUsd:
          anyOf:
            - type: number
              exclusiveMinimum: 0
            - type: 'null'
        dispatcherHandle:
          anyOf:
            - type: string
            - type: 'null'
      required:
        - project
        - agent
      additionalProperties: false
      description: Exactly one of `planId` or `issues` is required.
    CreatePlanRunResponse:
      type: object
      properties:
        planRun:
          $ref: '#/components/schemas/PlanRun'
        children:
          type: array
          items:
            $ref: '#/components/schemas/PlanRunChild'
      required:
        - planRun
        - children
      additionalProperties: false
    CreateProjectRequest:
      type: object
      properties:
        gitUrl:
          type: string
          minLength: 1
        defaultBranch:
          anyOf:
            - type: string
            - type: 'null'
      required:
        - gitUrl
      additionalProperties: false
    CreateRunRequest:
      type: object
      properties:
        agent:
          anyOf:
            - type: string
            - type: 'null'
        project:
          anyOf:
            - type: string
            - type: 'null'
        prompt:
          anyOf:
            - type: string
            - type: 'null'
        ref:
          anyOf:
            - type: string
            - type: 'null'
        baseCommit:
          anyOf:
            - type: string
            - type: 'null'
        targetBranch:
          anyOf:
            - type: string
            - type: 'null'
        existingBranch:
          anyOf:
            - type: string
            - type: 'null'
        providerOverride:
          anyOf:
            - type: string
            - type: 'null'
        modelOverride:
          anyOf:
            - type: string
            - type: 'null'
        trigger:
          anyOf:
            - type: string
            - type: 'null'
        seedId:
          anyOf:
            - type: string
            - type: 'null'
        dispatcherHandle:
          anyOf:
            - type: string
            - type: 'null'
        continueFromRunId:
          anyOf:
            - type: string
            - type: 'null'
        parentRunId:
          anyOf:
            - type: string
            - type: 'null'
        cloneFromRunId:
          anyOf:
            - type: string
            - type: 'null'
        rescueFromRunId:
          anyOf:
            - type: string
            - type: 'null'
        maxCostUsd:
          anyOf:
            - type: number
              exclusiveMinimum: 0
            - type: 'null'
        mulch:
          anyOf:
            - type: string
              enum:
                - 'on'
                - 'off'
            - type: 'null'
        metadata:
          anyOf:
            - type: object
              properties: {}
              additionalProperties: {}
            - type: 'null'
      additionalProperties: false
      description: >-
        Dispatch a run. `agent`, `project`, and `prompt` are required unless `cloneFromRunId` or
        `rescueFromRunId` is set.
    CreateRunResponse:
      type: object
      properties:
        run:
          $ref: '#/components/schemas/Run'
        sandbox:
          type: object
          properties:
            id:
              type: string
            workspacePath:
              type: string
          required:
            - id
            - workspacePath
          additionalProperties: false
      required:
        - run
        - sandbox
      additionalProperties: false
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            hint:
              type: string
          required:
            - code
            - message
          additionalProperties: false
      required:
        - error
      additionalProperties: false
      description: Error body for every non-success response.
    EventStream:
      type: string
